# ==========================================
# RemoteX Production Coturn Configuration
# ==========================================

# Listening ports
listening-port=3478
tls-listening-port=5349

# Listening IP addresses (0.0.0.0 listens on all interfaces)
listening-ip=0.0.0.0

# External relay IP (Set this to your public cloud IP in production)
# external-ip=YOUR_PUBLIC_IP

# Relay UDP and TCP port range
min-port=49152
max-port=65535

# Verbose logging
verbose
fingerprint

# WebRTC STUN/TURN standard options
lt-cred-mech
use-auth-secret
static-auth-secret=remotex_secret_turn_pass
realm=remotex.desktop

# Default User (for testing without HMAC)
user=remotex_user:remotex_secret_turn_pass

# TLS Certificates (Uncomment when deploying with custom SSL certificate)
# cert=/etc/coturn/certs/cert.pem
# pkey=/etc/coturn/certs/privkey.pem

# Security restrictions
no-cli
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
